<html lang="en">
  <head>
    <title>adu</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="/static/index.css" />
    <link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/static/favicon-16x16.png">
    <link rel="manifest" href="/static/site.webmanifest">
  </head>
  <body>
    <canvas id="scene" aria-label="Interactive miniature moss garden with a pond, bamboo and ferns"></canvas>
    <div class="scene-controls" role="group" aria-label="Garden controls">
      <label class="ambient-control" for="ambient-light">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="3.5"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.4 1.4m11.2 11.2L19 19M5 19l1.4-1.4M17.6 6.4 19 5"/></svg>
        <input id="ambient-light" aria-label="Ambient light" type="range" min="0" max="100" value="100" step="1" aria-valuetext="100 percent" />
      </label>
      <span class="control-divider" aria-hidden="true"></span>
      <button id="reset-view" type="button" title="Reset camera view">Reset</button>
    </div>
    <script type="module" src="/static/index.js"></script>
  </body>
</html>
